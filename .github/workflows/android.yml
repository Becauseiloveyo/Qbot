name: Android Tests

on:
  pull_request:
    paths:
      - "android/**"
      - "tests/conformance/memory-retrieval-parity.json"
      - ".github/workflows/android.yml"
  push:
    paths:
      - "android/**"
      - "tests/conformance/memory-retrieval-parity.json"
      - ".github/workflows/android.yml"

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK 37
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;36.0.0" --channel=3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build and test Android
        working-directory: android
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Verify Room schema export
        run: |
          test -f android/app/schemas/dev.qbot.android.data.db.QbotDatabase/3.json

      - name: Upload Room schema
        uses: actions/upload-artifact@v4
        with:
          name: qbot-room-schema-v3
          path: android/app/schemas
          if-no-files-found: error
