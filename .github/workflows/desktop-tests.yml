name: Desktop Tests

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e desktop
      - run: python -m unittest discover -s desktop/tests -v
