[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qbot-desktop"
version = "0.2.0.dev0"
description = "Qbot desktop runtime"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9,<3",
  "SQLAlchemy>=2.0.36,<3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["qbot*"]
